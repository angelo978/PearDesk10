name: Build PearDesk10

on:
  push:
    branches: [ "*" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.5"

    - name: Build Windows
      run: go build -o peardesk.exe ./cmd/peardesk

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk10-Windows
        path: peardesk.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install X11 dev packages for robotgo
      run: |
        sudo apt update
        sudo apt install -y \
          libx11-dev \
          libxtst-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.5"

    - name: Build Linux
      run: go build -o peardesk ./cmd/peardesk

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk10-Linux
        path: peardesk

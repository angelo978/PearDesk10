name: Build PearDesk10

on:
  push:
    branches: [ "*" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.5"

    - name: Build Windows
      run: go build -o peardesk.exe ./cmd/peardesk

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk10-Windows
        path: peardesk.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Linux dependencies (X11, GLX, FFmpeg)
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          pkg-config \
          libx11-dev \
          libxtst-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libgl1-mesa-dev \
          mesa-common-dev \
          libglu1-mesa-dev \
          libavcodec-dev \
          libavutil-dev \
          libswscale-dev

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.5"

    - name: Build Linux
      run: go build -o peardesk ./cmd/peardesk

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk10-Linux
        path: peardesk

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.5"

    - name: Install macOS dependencies
      run: |
        brew update
        brew install ffmpeg pkg-config

    - name: Build macOS
      run: go build -o peardesk-macos ./cmd/peardesk

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk10-macOS
        path: peardesk-macos

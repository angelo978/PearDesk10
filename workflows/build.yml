name: Build PearDesk10

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.5"

    - name: Build
      run: go build -o peardesk.exe ./cmd/peardesk

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk10
        path: peardesk.exe
